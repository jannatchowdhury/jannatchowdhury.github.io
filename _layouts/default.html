<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .top-nav { text-align: right; margin-bottom: 20px; padding: 10px 0; }
      .top-nav a { margin-left: 15px; text-decoration: none; font-weight: bold; color: #007698; font-size: 13px; }
      .top-nav a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Logo" style="border-radius: 4px; max-width: 100%; height: auto;" />
        {% endif %}
        <p>{{ site.description }}</p>
        <p><a href="{{ site.github.repository_url }}">View My GitHub Profile</a></p>
      </header>
      <section>
        <!-- Full-width Jesita-style Navigation Header Bar -->
      <div style="background-color: #fcfcfc; border-bottom: 1px solid #eaeaea; margin: -20px -40px 30px -40px; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif;">
        
        <!-- Left Side Name (Hidden on sidebar, prominent on top) -->
        <span style="font-weight: bold; font-size: 18px; color: #000; letter-spacing: 0.5px;">Khatun A Jannat Chowdhury</span>
        
        <!-- Right Side Nav Tabs -->
        <nav style="display: flex; align-items: center;">
          <a href="{{ '/' | relative_url }}" style="text-decoration: none; font-size: 12px; font-weight: bold; color: #007698; padding: 10px 20px; letter-spacing: 0.5px;">HOME</a>
          <a href="{{ '/about.html' | relative_url }}" style="text-decoration: none; font-size: 12px; font-weight: bold; color: #007698; padding: 10px 20px; border-left: 1px solid #eaeaea; letter-spacing: 0.5px;">ABOUT ME</a>
          <a href="{{ '/research.html' | relative_url }}" style="text-decoration: none; font-size: 12px; font-weight: bold; color: #007698; padding: 10px 20px; border-left: 1px solid #eaeaea; letter-spacing: 0.5px;">RESEARCH & PROJECTS</a>
         <a href="{{ '/teaching.html' | relative_url }}" style="text-decoration: none; font-size: 12px; font-weight: bold; color: #007698; padding: 10px 20px; border-left: 1px solid #eaeaea; letter-spacing: 0.5px;">TEACHING & OTHERS</a>
        </nav>
      </div>
        
        {{ content }}
      </section>
      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
