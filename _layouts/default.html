<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .top-nav { text-align: right; margin-bottom: 20px; padding: 10px 0; }
      .top-nav a { margin-left: 15px; text-decoration: none; font-weight: bold; color: #007698; font-size: 13px; }
      .top-nav a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        {% if site.logo %}
          <img src="{{ site.logo | relative_url }}" alt="Logo" style="border-radius: 4px; max-width: 100%; height: auto;" />
        {% endif %}
        <p>{{ site.description }}</p>
        <p><a href="{{ site.github.repository_url }}">View My GitHub Profile</a></p>
      </header>
      <section>
        <div class="top-nav">
          <a href="{{ '/about.html' | relative_url }}">ABOUT ME</a>
          <a href="{{ '/research.html' | relative_url }}">RESEARCH PAPERS & PROJECTS</a>
          <a href="{{ '/teaching.html' | relative_url }}">TEACHINGS & SCHOLARSHIPS</a>
          <a href="{{ '/certificates.html' | relative_url }}">CERTIFICATES</a>
          <a href="{{ '/eca.html' | relative_url }}">ECAs & VOLUNTEERINGS</a>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 30px;">
        
        {{ content }}
      </section>
      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
